name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q iOSStatusBarOverlay.zip -d project
          cd project/iOSStatusBarOverlay
          ls -la

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: project/iOSStatusBarOverlay
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iOSStatusBarOverlay-APK
          path: project/iOSStatusBarOverlay/app/build/outputs/apk/debug/*.apk
